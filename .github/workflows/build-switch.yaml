name: Build Switch NRO PT-BR

on:
  push:
    branches: [main, "ptbr/**"]
    paths-ignore:
    - README.md
    - images/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Test Portuguese metadata and stream options
      run: |
        g++ -std=c++17 -pthread -Itests/stubs -Iapp/include \
          -Ilibrary/borealis/library/include/borealis/extern \
          tests/portuguese_test.cpp app/src/api/portuguese_metadata.cpp -o /tmp/streamfin-pt-test
        /tmp/streamfin-pt-test
  build-nx:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    env:
      BASE_URL: https://github.com/dragonflylee/switchfin/releases/download/switch-portlibs
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install portlibs
      run: |
        for pkg in mbedtls-3.6.7-1 libssh2-1.11.1-1 dav1d-1.5.4-1 curl-8.16.0-3 ffmpeg-7.1.5-5 libmpv-0.36.0-5; do
          dkp-pacman --noconfirm -U $BASE_URL/switch-${pkg}-any.pkg.tar.zst
        done
        git config --system --add safe.directory $GITHUB_WORKSPACE
    - name: Build nro
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DPLATFORM_SWITCH=ON \
          -DBUILTIN_NSP=OFF \
          -DVERSION_BUILD=${{ github.run_number }}
        make -C build StreamFin.nro -j$(nproc)
    - name: Upload nro artifact
      uses: actions/upload-artifact@v4
      with:
        name: StreamFin-PT-BR-NintendoSwitch
        path: build/StreamFin.nro
